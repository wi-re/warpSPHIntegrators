[project]
name = "warpSPHIntegrators"
version = "0.6.0"
authors = [
  { name="Rene Winchenbach", email="contact@fluids.dev" },
]
maintainers = [
  { name="Rene Winchenbach", email="contact@fluids.dev" },
]
description = "Solver-agnostic explicit ODE time integrators for SPH, in PyTorch."
readme = "README.md"
keywords = ["sph", "ode", "integrator", "runge-kutta", "symplectic", "pytorch"]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
  "torch", "numpy"
]
# The CI matrix is the supported floor: 3.11-3.13 (see .github/workflows/tests.yml).
requires-python = ">=3.11"
license = {file = "license.md"}

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.urls]
Repository = "https://github.com/wi-re/warpSPHIntegrators"
Documentation = "https://fluids.dev/warpSPHIntegrators/"
Issues = "https://github.com/wi-re/warpSPHIntegrators"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Only py.typed, not a blanket "*.*" glob -- that shipped __pycache__ whenever one
# happened to be present at build time.
[tool.setuptools.package-data]
"warpSPHIntegrators" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Test categories, assigned automatically per test file (CATEGORIES in
# tests/conftest.py). Run a category with `pytest -m <name>`, e.g.
# `pytest -m dirk -n auto` for the DIRK tests in parallel.
markers = [
  "core: state machinery, field semantics, registry metadata, backend dispatch",
  "solvers: JFNK / GMRES solver core and preconditioning hooks",
  "dirk: DIRK driver and tableaus",
  "bdf: BDF1-5 and TR-BDF2",
  "am: JFNK-corrected Adams-Moulton AM2-AM4",
  "multistep: explicit / implicit Adams-Bashforth multistep (PECE)",
  "ark: additive IMEX RK tableaus",
  "imex: IMEX Euler and IMEX linear multistep (SBDF2/3, CNAB2)",
  "fullyimplicit: coupled Gauss-Legendre / Radau IIA block driver",
  "exponential: ETD2RK and EXPRB32 exponential integrators",
  "rosenbrock: Rosenbrock-W (ROS3P)",
  "rkc: RKC1/RKC2 and RKL2 stabilised explicit methods",
  "newmark: Newmark-beta scheme",
  "convergence: cross-family order, embedded pairs, first-stage reuse",
  "stability: cross-family stiffness, Hamiltonian, TVD/SSP, benchmarks",
  "gradients: cross-family gradient and adaptive-step helper tests",
  "rhs: structured RHS interface (RHS / IMEXRHS / SemilinearRHS)",
]