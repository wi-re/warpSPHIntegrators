[project]
name = "warpSPHIntegrators"
version = "0.5.0"
authors = [
  { name="Rene Winchenbach", email="contact@fluids.dev" },
]
maintainers = [
  { name="Rene Winchenbach", email="contact@fluids.dev" },
]
description = "Solver-agnostic explicit ODE time integrators for SPH, in PyTorch."
readme = "README.md"
keywords = ["sph", "ode", "integrator", "runge-kutta", "symplectic", "pytorch"]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",

    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
  "torch", "numpy"
]
license = {file = "license.md"}

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/wi-re/warpSPHIntegrators"
Issues = "https://github.com/wi-re/warpSPHIntegrators"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Only py.typed, not a blanket "*.*" glob -- that shipped __pycache__ whenever one
# happened to be present at build time.
[tool.setuptools.package-data]
"integrators" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]