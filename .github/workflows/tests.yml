name: tests

on:
  # push trigger disabled 2026-09-17: a full run is ~30 min per Python
  # version (x3 matrix) on a 2-vCPU runner, which was too much compute per
  # push and was slowing local development. Kept on pull_request as the gate.
  # Improving CI time is an open item (IMPLICIT_ROADMAP.md, Infrastructure).
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # CPU torch only -- the suite is float64 scalar work, a GPU build buys nothing
        # and costs several minutes of download per job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -q
