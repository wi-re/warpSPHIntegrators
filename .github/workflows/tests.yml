name: tests

on:
  push:
    branches: [main]
  pull_request:

# Test categories are assigned per test file in tests/conftest.py (CATEGORIES)
# and registered in pyproject.toml. Each job runs one balanced shard -- a small
# OR-expression of category markers -- and the union of the shards is the full
# suite, so no test is dropped from the gate. The wave-8 CPU timing sweep
# (2026-10-14) moves geometry beside the cheap specialized families and reuse
# beside core/solvers; the convergence net keeps its own shard. Push runs Python 3.13
# only (re-enabled 2026-09-17 now that a push is one shard sweep of ~8 min
# instead of ~31 min; first measured push ran 8:14); pull requests keep the
# full 3.11/3.12/3.13 matrix. 6 shards x 3 versions = 18 jobs, inside the
# public-repo concurrency cap of 20.
jobs:
  shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open(".github/test-shards.json"))))')" >> "$GITHUB_OUTPUT"

  pytest:
    needs: shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11", "3.12", "3.13"]') || fromJSON('["3.13"]') }}
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # CPU torch only -- the suite is float64 scalar work, a GPU build buys nothing
        # and costs several minutes of download per job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"

      - name: Run tests
        # Two xdist workers on the 2-vCPU runner, one BLAS thread each (no
        # oversubscription). The suite is xdist-safe: no test writes files or
        # relies on cross-file execution order (verified 2026-09-17).
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
        run: pytest -q -n 2 --dist=worksteal -m "${{ matrix.shard }}"
